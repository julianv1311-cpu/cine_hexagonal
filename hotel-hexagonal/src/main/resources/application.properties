# --- Aplicación ---
quarkus.application.name=hotel-hexagonal
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.http.port=8080

# --- Base de datos MySQL (XAMPP) ---
# La base "hotel_hexagonal" se crea sola gracias a createDatabaseIfNotExist=true
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/hotel_hexagonal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# Evita que Quarkus intente levantar un contenedor de base de datos (Dev Services)
quarkus.datasource.devservices.enabled=false

# Crea/actualiza las tablas automáticamente (conserva los datos)
quarkus.hibernate-orm.schema-management.strategy=update
# MariaDB (XAMPP) reporta versión 5.5.5; se desactiva el chequeo de versión
quarkus.hibernate-orm.database.version-check.enabled=false
# Muestra el SQL en consola (útil para la sustentación)
quarkus.hibernate-orm.log.sql=true

# --- Swagger / OpenAPI ---
# Documento OpenAPI en /q/openapi e interfaz Swagger en /q/swagger-ui
# En Quarkus, el título/versión/descripción se configuran aquí (tienen prioridad).
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Hotel Westin API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=Documentación de los recursos del proyecto hotel-hexagonal: vistas HTML (habitaciones, huéspedes y reservas) y reportes PDF. No es una API REST aparte: cada recurso sirve una página o un archivo PDF.

# --- Datos de prueba ---
# Si las tablas están vacías, al arrancar se cargan habitaciones, huéspedes y reservas de ejemplo.
hotel.seed.enabled=true
