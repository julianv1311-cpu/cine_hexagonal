{#include layout}
{#title}Error {code}{/title}
{#main}

<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 text-center">
            <div class="card-body p-5">
                <span class="d-inline-block rounded-circle bg-danger-subtle text-danger-emphasis p-3 lh-1 fs-1 mb-3"><i class="bi bi-exclamation-octagon"></i></span>
                <div class="display-4 fw-bold text-danger">{code}</div>
                <h1 class="h4 fw-bold mb-3">{errorTitle}</h1>
                <div class="alert alert-danger mb-4" role="alert">{message}</div>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a class="btn btn-warning rounded-pill px-4" href="/"><i class="bi bi-house"></i> Volver al inicio</a>
                    <a class="btn btn-outline-secondary rounded-pill px-4" href="/reservations">Ver reservas</a>
                </div>
            </div>
        </div>
    </div>
</div>

{/main}
{/include}
