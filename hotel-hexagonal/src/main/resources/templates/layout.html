<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{#insert title}Inicio{/} | Hotel Westin</title>
    <!-- Toda la apariencia se hace con Bootstrap 5 (CDN) y sus clases utilitarias -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Aplica el modo claro/oscuro guardado antes de pintar la página -->
    <script src="/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-warning border-2 sticky-top shadow" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span class="badge bg-warning text-dark fs-6 rounded-3 px-2 py-2"><i class="bi bi-buildings-fill"></i></span>
                <span class="fw-bold text-warning">Hotel Westin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-lg-auto gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link {#if page == 'rooms'}active fw-semibold text-warning{/if}" href="/"><i class="bi bi-door-open"></i> Habitaciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {#if page == 'guests'}active fw-semibold text-warning{/if}" href="/guests"><i class="bi bi-people"></i> Huéspedes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {#if page == 'reservations'}active fw-semibold text-warning{/if}" href="/reservations"><i class="bi bi-calendar-check"></i> Reservas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {#if page == 'reports'}active fw-semibold text-warning{/if}" href="/reports"><i class="bi bi-bar-chart-line"></i> Reportes</a>
                    </li>
                </ul>
                <div class="d-flex flex-wrap gap-2 py-2 py-lg-0">
                    <a class="btn btn-sm btn-outline-light rounded-pill px-3" href="/q/swagger-ui" target="_blank" rel="noopener">
                        <i class="bi bi-braces"></i> Swagger
                    </a>
                    <button id="theme-toggle" class="btn btn-sm btn-warning rounded-pill px-3" type="button" title="Cambiar entre modo claro y oscuro">
                        <i id="theme-icon" class="bi bi-moon-stars-fill"></i> <span id="theme-label">Modo oscuro</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">

        {#if success}
        <div class="alert alert-success alert-dismissible fade show border-0 border-start border-success border-4 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> {success}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        {/if}
        {#if error}
        <div class="alert alert-danger alert-dismissible fade show border-0 border-start border-danger border-4 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {error}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        {/if}

        {#insert main}{/}

    </main>

    <footer class="bg-dark text-white-50 border-top border-warning border-2 py-4 mt-auto" data-bs-theme="dark">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
            <span><i class="bi bi-buildings text-warning"></i> <span class="text-white">Hotel Westin</span> - Sistema de reservas con arquitectura hexagonal</span>
            <span>Desarrollo Orientado a Servicios - Quarkus, Qute y Bootstrap 5</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
